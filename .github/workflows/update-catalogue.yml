      - name: Download Steam app list
        run: |
          set -e

          python3 <<'PY'
          import json
          import urllib.request

          url = "https://api.steampowered.com/ISteamApps/GetAppList/v2/"

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Zeni-Catalogue/1.0"
              }
          )

          with urllib.request.urlopen(
              request,
              timeout=60
          ) as response:
              raw = response.read()

          if not raw:
              raise SystemExit(
                  "Steam returned an empty response."
              )

          try:
              data = json.loads(raw.decode("utf-8"))
          except Exception as error:
              print(
                  "Steam returned invalid JSON."
              )
              print(
                  raw[:500].decode(
                      "utf-8",
                      errors="replace"
                  )
              )
              raise SystemExit(1)

          apps = (
              data
              .get("applist", {})
              .get("apps")
          )

          if not isinstance(apps, list) or not apps:
              raise SystemExit(
                  "Steam returned no applications."
              )

          with open(
              "steam-apps.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  data,
                  file,
                  ensure_ascii=False
              )

          print(
              f"Downloaded {len(apps)} Steam applications."
          )
          PY
