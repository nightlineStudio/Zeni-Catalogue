name: Update Zeni Catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

jobs:
  update-steam-catalogue:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Steam app list
        run: |
          curl -L \
            "https://api.steampowered.com/ISteamApps/GetAppList/v2/" \
            -o steam-apps.json

      - name: Generate Steam catalogue
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          source = Path("steam-apps.json")
          output = Path("catalogue/zenith.json")

          with source.open("r", encoding="utf-8") as f:
              data = json.load(f)

          apps = data.get("applist", {}).get("apps", [])

          catalogue = []

          seen = set()

          for app in apps:
              app_id = app.get("appid")
              name = app.get("name")

              if not app_id or not name:
                  continue

              name = name.strip()

              if not name:
                  continue

              key = str(app_id)

              if key in seen:
                  continue

              seen.add(key)

              catalogue.append({
                  "Id": f"steam.{key}",
                  "Name": name,
                  "Service": "Steam",
                  "TrainerStatus": "NoTrainer"
              })

          catalogue.sort(
              key=lambda game: game["Name"].lower()
          )

          output.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          with output.open("w", encoding="utf-8") as f:
              json.dump(
                  catalogue,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

              f.write("\n")

          print(
              f"Generated {len(catalogue)} Steam games."
          )
          PY

      - name: Update catalogue version
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          version_file = Path("version.json")

          if version_file.exists():
              try:
                  with version_file.open("r", encoding="utf-8") as f:
                      data = json.load(f)

                  version = int(data.get("version", 0))

              except Exception:
                  version = 0
          else:
              version = 0

          version += 1

          with version_file.open("w", encoding="utf-8") as f:
              json.dump(
                  {"version": version},
                  f,
                  indent=2
              )

              f.write("\n")

          print(f"Catalogue version: {version}")
          PY

      - name: Remove temporary files
        run: |
          rm -f steam-apps.json

      - name: Commit catalogue changes
        run: |
          git config user.name "Zeni Catalogue Bot"
          git config user.email "actions@users.noreply.github.com"

          git add catalogue/zenith.json version.json

          if git diff --cached --quiet; then
            echo "No catalogue changes."
            exit 0
          fi

          git commit -m "Update Steam catalogue"
          git push
